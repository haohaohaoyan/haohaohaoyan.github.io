<!DOCTYPE html>
<html>
    <head>
        <title>doodle!</title>
    </head>
    <body>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 4px;
            }

            label, p {
                font-family: 'Courier New';
                color: black;
                margin: 0;
            }

            canvas {
                display: block;
                width: 800;
                height: 600;
                margin: auto;
                align-self: center;
                border: 2px solid black;
            }
            
            button {
                background-color: white;
                border: 2px solid black;
            }

            .bar {
                display: flex;
                flex-direction: row;
                position: fixed;
                padding: 5px;
                max-width: 90%;
                border: 2px solid black;
                border-radius: 4px;;
                background-color: white;
                overflow-x: auto;
                white-space: nowrap;
            }

            .tool {
                top: 8px;
                left: 8px;
            }

            .palette {
                bottom: 8px;
                right: 8px;
            }

            #colorgrid {
                display: grid;
                grid-template-columns: 1.5em;
                grid-template-rows: repeat(3, 1.5em);
                grid-auto-flow: column;
            }

            .colorswatch {
                width: 1.5em;
                height: 1.5em;
            }

            #explosiongif {
                pointer-events: none;
                display: none;
                position: absolute;
                top: 0;
                z-index: 9999;
                height: 100%;
                width: 100%;
                margin: auto;
            }

            #imagepreview {
                width: 20px;
            }

            #addcolor {
                display: none;
            }

            ::-webkit-scrollbar {
                background-color: #cdcdcd;
            }

            ::-webkit-scrollbar-thumb {
                background-color: #bababa;
                border: outset #bababa;
            }
        </style>
        <div class="tool bar"> <!-- Class naming shenanigans-->
            <!-- Top div for tool select & tool options-->
            <select id="tool-select">
                <!-- tool selection-->
                <option value="pen" title="Your standard drawing tool">Pen</option>
                <option value="eraser" title="White pen with a different name">Eraser</option>
                <option value="brush" title="Stamp & draw with images">Image brush</option>
                <option value="colorpicker" title="Eyedropper colorpicker">Color picker</option>
                <option value="wipe" title="Clear the canvas">Clear Screen</option>
            </select>
            <input id="color" type="color">
            <button id="addcolor" style="display: none">Add to Palette</button>
            <input id="size" type="range" min="1" max="32" name="Size" value = "1">
            <img id="imagepreview">
            <input id="imagesrc" type="text" placeholder="Image source link"> 
            <!-- Select for the image brush options-->
            <select id="image-brush-select">
                <option value="stamp" title="Click to draw an image exactly once and then stop, like a stamp">Stamp</option>
                <option value="brush" title="Drag & smear image all over canvas">Brush</option>
                <option value="dotted" title="Brush, but images are spaced out">Spaced brush</option>
            </select>
            <p id="colorpickerwarning">Press ESCAPE to cancel</p>
            <button id="wipebutton">Nuke EVERYTHING</button>
        </div>
        <div style="width: stretch; height: stretch; display: flex;">
            <canvas>
                <!-- actual drawing canvas -->
            </canvas>
        </div>

        <div class="palette bar">
            <!-- Bar for storing color selections, images, and other universal tools -->
            <button id="savecanvas">Save Canvas</button>
            <div id="colorgrid">
            </div>
            <div id="imagegrid">
            </div>
        </div>

        <img id="explosiongif" src="assets/kaboom.gif">

        <script>
            var canvas = document.querySelector("canvas"); // only ever will be one canvas on this page
            var canvasContext = canvas.getContext("2d");
            var toolSelect = document.querySelector("#tool-select");

            var colorPalette= document.querySelector("#colorgrid");

            var imageBase = new Image;

            var eyedropperAvailable = false;
            // instance eyedropper
            if (window.EyeDropper) {
                var eyedropper = new EyeDropper();
                eyedropperAvailable = true;
            }

            var currentPalette = [];
            var currentTool = "pen";

            function chooseTool(newTool) {
                currentTool = newTool;
                // Hides all tool-specific options & reverts to default
                for (option of ["#color", "#size", "#imagepreview", "#imagesrc",
                    "#image-brush-select", "#wipebutton", "#colorpickerwarning",
                    "#addcolor"]) {
                    document.querySelector(option).style.display = "none";
                };
                canvasContext.strokeStyle = document.querySelector("#color").value;
                // Sets defaults, shows & necessary tools
                switch (newTool) {
                    case "pen" :
                        document.querySelector("#color").style.display = "inline-block";
                        document.querySelector("#size").style.display = "inline-block";
                        canvas.onmousedown = handleDrawPen;
                        break; // js WHYYYYYYYYYYYY
                    case "eraser":
                        document.querySelector("#size").style.display = "inline-block";
                        canvasContext.strokeStyle = "white";
                        canvas.onmousedown = handleDrawPen;
                        break;
                    case "brush":
                        document.querySelector("#imagepreview").style.display = "inline-block"
                        document.querySelector("#imagesrc").style.display = "inline-block";
                        document.querySelector("#image-brush-select").style.display = "inline-block";
                        document.querySelector("#size").style.display = "inline-block";
                        document.querySelector("#size").value = 16; // make the image scale 1/1
                        canvas.onmousedown = imageBrush;
                        break;
                    case "colorpicker":
                        document.querySelector("#colorpickerwarning").style.display = "inline-block";
                        if (!eyedropperAvailable) {
                            alert("Eyedropper function isn't available so this won't do anything.");
                            break;
                        } else {
                            eyedropper.open().then(
                                (color) => {
                                    document.querySelector("#color").value = color.sRGBHex;
                                    // color change takes effect on toolchange
                                    toolSelect.value = "pen";
                                    chooseTool("pen");
                                    // Check for new color just in case
                                    if (!currentPalette.includes(document.querySelector("#color").value)) {
                                        document.querySelector("#addcolor").style.display = "inline-block";
                                    };
                                }
                            ).catch((err) => {
                                // Have to duplicate bc this isn't an async function and I want it to wait until color is selected
                                toolSelect.value = "pen";
                                chooseTool("pen");
                            }); 
                            break;
                        };
                        break;
                    case "wipe":
                        document.querySelector("#wipebutton").style.display = "inline-block";
                        canvas.onmousedown = null;
                        break;
                };
            };

            // For pen, eraser, etc.
            function handleDrawPen(event) {
                event.preventDefault();
                // Start drawing by beginning path and moving to current mouse start pos
                canvasContext.moveTo(event.clientX, event.clientY);
                canvasContext.beginPath();
                // Clean dragging my beloved
                document.onmousemove = dragDraw, document.onmouseup = stopDraw, document.onmouseleave = stopDraw;

                // create current path
                var currentPath = new Path2D;

                // last draw position
                var lastX = event.clientX, lastY = event.clientY;

                function dragDraw(event) {
                    event.preventDefault();
                    // constantly draw as you are dragging
                    // don't draw if it's too close to the last point, prevents jagged lines
                    if (Math.abs(event.clientX - lastX) > 1 || Math.abs(event.clientY - lastY) > 1) {
                        // THANK GOODNESS I DONT HAVE TO CONSIDER WINDOW MOVEMENT & SIZE WOOHOO
                        var translatedX = event.clientX - canvas.getBoundingClientRect().left;
                        var translatedY = event.clientY - canvas.getBoundingClientRect().top;
                        // Add point to current path
                        currentPath.lineTo(translatedX, translatedY);
                        canvasContext.stroke(currentPath);
                        // Update values
                        lastX = event.clientX, lastY = event.clientY;
                    };
                }; 

                function stopDraw(event) {
                    // kills event listeners
                    event.preventDefault();
                    // do the draw thing anyway for dots 
                    dragDraw(event);
                    dragDraw(event);
                    document.onmousemove = null, document.onmouseup = null, document.onmouseleave = null;
                };
            };

            // Function for drawing images
            function imageBrush(event) {
                event.preventDefault();
                var scale = document.querySelector("#size").value;
                // Setup translated mouse coordinates
                var translatedX = event.clientX - canvas.getBoundingClientRect().left;
                var translatedY = event.clientY - canvas.getBoundingClientRect().top;
                // Check mode
                var brushMode = document.querySelector("#image-brush-select").value;
                // First check if stamp is on and draw a single image and quit
                if (brushMode == "stamp") {
                    try {
                        canvasContext.drawImage(imageBase, 
                        translatedX - ((scale / 16) * imageBase.width / 2), 
                        translatedY - ((scale / 16) * imageBase.height / 2),
                        dWidth = (scale / 16) * imageBase.width, dHeight = (scale / 16) * imageBase.height);
                    } catch (err){
                        if (err instanceof ReferenceError) {alert("No image set!");};  
                    };
                } else { // this means that it's the regular brush draw thing
                    // pretty much same as regular draw function, functions are in this scope only
                    document.onmousemove = dragBrush, document.onmouseup = stopBrush, document.onmouseleave = stopBrush;

                    // store previous location
                    var lastX = event.clientX, lastY = event.clientY;
                    // draw one to start it off
                    canvasContext.drawImage(imageBase, 
                        translatedX - ((scale / 16) * imageBase.width / 2), 
                        translatedY - ((scale / 16) * imageBase.height / 2),
                        dWidth = (scale / 16) * imageBase.width, dHeight = (scale / 16) * imageBase.height);
                    
                    function dragBrush(event) {
                        event.preventDefault();
                        if (Math.abs(event.clientX - lastX) > ((brushMode == "dotted") ? ((scale / 16) * imageBase.width) : 1)
                            || Math.abs(event.clientY - lastY) > ((brushMode == "dotted") ? ((scale / 16) * imageBase.height) : 1)) {
                            var translatedX = event.clientX - canvas.getBoundingClientRect().left;
                            var translatedY = event.clientY - canvas.getBoundingClientRect().top;
                            // draw image
                            canvasContext.drawImage(imageBase, 
                                translatedX - ((scale / 16) * imageBase.width / 2), 
                                translatedY - ((scale / 16) * imageBase.height / 2),
                                dWidth = (scale / 16) * imageBase.width, dHeight = (scale / 16) * imageBase.height);
                            // Update values
                            lastX = event.clientX, lastY = event.clientY;
                        };
                    }

                    function stopBrush() {
                        event.preventDefault()
                        document.onmousemove = null, document.onmouseup = null, document.onmouseleave = null;
                    }
                }
            };

            // Function for adding a certain color to the palette
            function addToPalette(color) {
                var newSwatch = document.createElement("div");
                newSwatch.classList = "colorswatch";
                newSwatch.style.backgroundColor = color;
                newSwatch.title = color;
                colorPalette.insertAdjacentElement("beforeend", newSwatch);
                newSwatch.onclick = (event) => {
                    event.preventDefault();
                    canvasContext.strokeStyle = color;
                    document.querySelector("#color").value = color;
                };
                // add to color tracker for adding new colors
                currentPalette.push(color);
            };

            // Add to Palette button adds current colorpicker value to palette
            document.querySelector("#addcolor").addEventListener("click", () => {
                addToPalette(document.querySelector("#color").value);
                document.querySelector("#addcolor").style.display = "none";
            });

            // Set color from color input
            document.querySelector("#color").addEventListener("change", () => {
                canvasContext.strokeStyle = document.querySelector("#color").value;
                // Hide button first
                document.querySelector("#addcolor").style.display = "none";
                if (!currentPalette.includes(document.querySelector("#color").value)) {
                    document.querySelector("#addcolor").style.display = "inline-block";
            }});

            // Set stroke size from size setter
            document.querySelector("#size").addEventListener("change", () => {
                canvasContext.lineWidth = document.querySelector("#size").value;
            });

            // Set image brush source
            document.querySelector("#imagesrc").addEventListener("change", () => {
                fetch(document.querySelector("#imagesrc").value).then((response) => {
                    if (!response.ok) {
                        // No way to ignore the actual error
                        alert("No image there!");
                        imageBase.src = "//:0";
                    } else {
                        imageBase.src = document.querySelector("#imagesrc").value;
                        document.querySelector("#imagepreview").src = document.querySelector("#imagesrc").value;
                    }
                });
            });

            // Attached to image in case the thing isn't an image
            imageBase.onerror = () => {
                if (imageBase.src != "//:0") {
                    alert("That isn't an image!");
                    imageBase.src = "//:0"; // somehow this properly nulls it out? thanks stackoverflow
                    return
                }
            };

            // Button that nukes the damn canvas
            var explosion_timeout;
            var explosiongifdisplay = document.querySelector("#explosiongif");
            document.querySelector("#wipebutton").addEventListener("click", () => {
                // Kill existing timeouts to prevent conflict
                if (explosion_timeout) {
                    clearTimeout(explosion_timeout);
                };
                // Actually clear the damn thing
                canvasContext.clearRect(0, 0, canvas.width, canvas.height);
                // Resets src to restart gif
                explosiongifdisplay.src = "assets/kaboom.gif";
                explosiongifdisplay.style.display = "inline-block";
                // set timeout to make it kill itself
                explosion_timeout = setTimeout(() => {
                    explosiongifdisplay.style.display = "none";
                    explosiongifdisplay.src = "";
                }, 1360); // exact length of gif is 1.36 seconds

                // Reset background
                canvasContext.fillStyle = "#ffffff";
                canvasContext.fillRect(0, 0, canvas.width, canvas.height);
            });

            // Button that saves canvas image and downloads it
            document.querySelector("#savecanvas").addEventListener("click", () => {
                // creates a link instead and then immediately clicks it
                // thanks stackoverflow guy, 12am thinking is failing me
                var dlLink = document.createElement("a");
                dlLink.download = "doodle.png"; 
                dlLink.href = canvas.toDataURL();
                dlLink.click();
            })

            // Set resolution of canvas, line properties

            canvas.height = 600;
            canvas.width = 800;

            canvasContext.lineCap = "round";
            canvasContext.lineJoin = "round";

            // Fill background color
            canvasContext.fillStyle = "#ffffff";
            canvasContext.fillRect(0, 0, canvas.width, canvas.height);

            toolSelect.addEventListener("change", () => {
                chooseTool(toolSelect.value);
            });

            // Populate default colors (PICO 8 Palette)
            for (color of ["#000000", "#1d2b53" , "#7e2553", 
                "#008751", "#ab523b", "#5f574f", 
                "#c2c3c7", "#ffffff", "#ff004d", 
                "#ffa300", "#ffec27", "#00e436",
                "#29adff", "#83769c", "#ff77ab",
                "#ffccaa"]) {
                addToPalette(color);
            };

            // Set default tool as pen

            chooseTool("pen");
        </script>
    </body>
</html>
