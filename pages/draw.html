<!DOCTYPE html>
<html>
    <head>
        <title>doodle!</title>
    </head>
    <body>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 4px;
            }

            label, p {
                font-family: 'Courier New';
                color: black;
                margin: 0;
            }

            canvas {
                display: block;
                width: 800;
                height: 600;
                margin: auto;
                align-self: center;
                border: 2px solid black;
            }

            #toolbar {
                position: fixed;
                padding: 5px;
                top: 8px;
                left: 8px;
                max-width: 90%;
                border: 2px solid black;
                border-radius: 4px;;
                background-color: white;
                overflow-x: auto;
                white-space: nowrap;
            }

            #explosiongif {
                pointer-events: none;
                display: none;
                position: absolute;
                top: 0;
                z-index: 9999;
                height: 100%;
                margin: auto;
            }

            #imagepreview {
                width: 20px;
            }

            ::-webkit-scrollbar {
                background-color: #cdcdcd;
            }

            ::-webkit-scrollbar-thumb {
                background-color: #bababa;
                border: outset #bababa;
            }
        </style>
        <div id="toolbar">
            <!-- big div for all of the options-->
            <select id="tool-select">
                <!-- tool selection-->
                <option value="pen" title="Your standard drawing tool">Pen</option>
                <option value="eraser" title="White pen with a different name">Eraser</option>
                <option value="brush" title="Stamp & draw with images">Image brush</option>
                <option value="colorpicker" title="Eyedropper colorpicker">Color picker</option>
                <option value="wipe" title="Clear the canvas">Clear Screen</option>
            </select>
            <input id="color" type="color">
            <input id="size" type="range" min="1" max="32" name="Size" value = "1">
            <img id="imagepreview">
            <input id="imagesrc" type="text" placeholder="Image source link"> 
            <input id="imagestampoption" type="checkbox" checked>
            <label id="stamplabel" for="imagestampoption">Stamp mode</label>
            <p id="colorpickerwarning">Press ESCAPE to cancel</p>
            <button id="wipebutton">Nuke EVERYTHING</button>
        </div>
        <div style="width: stretch; height: stretch; display: flex;">
            <canvas>
                <!-- actual drawing canvas -->
            </canvas>
        </div>
        <img id="explosiongif" src="assets/kaboom.gif">
        <script>
            var canvas = document.querySelector("canvas"); // only ever will be one canvas on this page
            var canvasContext = canvas.getContext("2d");
            var toolSelect = document.querySelector("#tool-select");
            var imageBase = new Image;

            var eyedropperAvailable = false;
            // instance eyedropper
            if (window.EyeDropper) {
                var eyedropper = new EyeDropper();
                eyedropperAvailable = true;
            }

            var currentTool = "pen";

            function chooseTool(newTool) {
                currentTool = newTool;
                // Hides all tool-specific options & reverts to default
                for (option of ["#color", "#size", "#imagepreview", "#imagesrc", "#imagestampoption", "#wipebutton", "#stamplabel", "#colorpickerwarning"]) {
                    document.querySelector(option).style.display = "none";
                };
                canvasContext.strokeStyle = document.querySelector("#color").value;
                // Sets defaults, shows & necessary tools
                switch (newTool) {
                    case "pen" :
                        document.querySelector("#color").style.display = "inline-block";
                        document.querySelector("#size").style.display = "inline-block";
                        canvas.onmousedown = handleDrawPen;
                        break; // js WHYYYYYYYYYYYY
                    case "eraser":
                        document.querySelector("#size").style.display = "inline-block";
                        canvasContext.strokeStyle = "white";
                        canvas.onmousedown = handleDrawPen;
                        break;
                    case "brush":
                        document.querySelector("#imagepreview").style.display = "inline-block"
                        document.querySelector("#imagesrc").style.display = "inline-block";
                        document.querySelector("#imagestampoption").style.display = "inline-block";
                        document.querySelector("#stamplabel").style.display = "inline-block";
                        document.querySelector("#size").style.display = "inline-block";
                        document.querySelector("#size").value = 16; // make the image scale 1/1
                        canvas.onmousedown = imageBrush;
                        break;
                    case "colorpicker":
                        document.querySelector("#colorpickerwarning").style.display = "inline-block";
                        if (!eyedropperAvailable) {
                            alert("Eyedropper function isn't available so this won't do anything.");
                            break;
                        } else {
                            eyedropper.open().then(
                                (color) => {
                                    document.querySelector("#color").value = color.sRGBHex;
                                    // changing the value of the color selection also changes stroke style automatically
                                    toolSelect.value = "pen";
                                    chooseTool("pen");
                                }
                            ).catch((err) => {
                                // Have to duplicate bc this isn't an async function and I want it to wait until color is selected
                                toolSelect.value = "pen";
                                chooseTool("pen");
                            }); 
                            break;
                        };
                        break;
                    case "wipe":
                        document.querySelector("#wipebutton").style.display = "inline-block";
                        canvas.onmousedown = null;
                        break;
                };
            };

            // For pen, eraser, etc.
            function handleDrawPen(event) {
                event.preventDefault();
                // Start drawing by beginning path and moving to current mouse start pos
                canvasContext.moveTo(event.clientX, event.clientY);
                canvasContext.beginPath();
                // Clean dragging my beloved
                document.body.onmousemove = dragDraw, document.body.onmouseup = stopDraw, document.body.onmouseleave = stopDraw;

                // create current path
                var currentPath = new Path2D;

                // last draw position
                var lastX = event.clientX, lastY = event.clientY;

                function dragDraw(event) {
                    event.preventDefault();
                    // constantly draw as you are dragging
                    // don't draw if it's too close to the last point, prevents jagged lines
                    if (Math.abs(event.clientX - lastX) > 1 || Math.abs(event.clientY - lastY) > 1) {
                        // THANK GOODNESS I DONT HAVE TO CONSIDER WINDOW MOVEMENT & SIZE WOOHOO
                        var translatedX = event.clientX - canvas.getBoundingClientRect().left;
                        var translatedY = event.clientY - canvas.getBoundingClientRect().top;
                        // Add point to current path
                        currentPath.lineTo(translatedX, translatedY);
                        canvasContext.stroke(currentPath);
                        // Update values
                        lastX = event.clientX, lastY = event.clientY;
                    };
                }; 

                function stopDraw(event) {
                    // kills event listeners
                    event.preventDefault();
                    // do the draw thing anyway for dots 
                    dragDraw(event);
                    document.body.onmousemove = null, document.body.onmouseup = null, document.body.onmouseleave = null;
                };
            };

            // Function for drawing images
            function imageBrush(event) {
                event.preventDefault();
                var scale = document.querySelector("#size").value;
                // Setup translated mouse coordinates
                var translatedX = event.clientX - canvas.getBoundingClientRect().left;
                var translatedY = event.clientY - canvas.getBoundingClientRect().top;
                // First check if stamp is on and draw a single image and quit
                if (document.querySelector("#imagestampoption").checked) {
                    try {
                        canvasContext.drawImage(imageBase, 
                        translatedX - ((scale / 16) * imageBase.width / 2), 
                        translatedY - ((scale / 16) * imageBase.height / 2),
                        dWidth = (scale / 16) * imageBase.width, dHeight = (scale / 16) * imageBase.height);
                    } catch (err){
                        console.log(errs)
                        //if (err instanceof ReferenceError) {alert("No image set!");};  
                    };
                };
            };

            // Set color from color input
            document.querySelector("#color").addEventListener("change", () => {
                canvasContext.strokeStyle = document.querySelector("#color").value;
            });

            // Set stroke size from size setter
            document.querySelector("#size").addEventListener("change", () => {
                canvasContext.lineWidth = document.querySelector("#size").value;
            });

            // Set image brush source
            document.querySelector("#imagesrc").addEventListener("change", () => {
                imageBase.src = document.querySelector("#imagesrc").value;
                document.querySelector("#imagepreview").src = document.querySelector("#imagesrc").value;
            });

            // Button that nukes the damn canvas
            var explosion_timeout;
            var explosiongifdisplay = document.querySelector("#explosiongif");
            document.querySelector("#wipebutton").addEventListener("click", () => {
                // Kill existing timeouts to prevent conflict
                if (explosion_timeout) {
                    clearTimeout(explosion_timeout);
                };
                // Actually clear the damn thing
                canvasContext.clearRect(0, 0, canvas.width, canvas.height);
                // Resets src to restart gif
                explosiongifdisplay.src = "assets/kaboom.gif";
                explosiongifdisplay.style.display = "flex";
                // set timeout to make it kill itself
                explosion_timeout = setTimeout(() => {
                    explosiongifdisplay.style.display = "none";
                    explosiongifdisplay.src = "";
                }, 1360); // exact length of gif is 1.36 seconds
            });

            // Set resolution of canvas, line properties

            canvas.height = 600;
            canvas.width = 800;

            canvasContext.lineCap = "round";
            canvasContext.lineJoin = "round";

            toolSelect.addEventListener("change", () => {
                chooseTool(toolSelect.value);
            });

            // Set default tool as pen

            chooseTool("pen");
        </script>
    </body>
</html>
