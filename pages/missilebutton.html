<!DOCTYPE html>
<html>
    <head>
        <title>Launch Missile</title>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
				}
			}
		</script>
    </head>
    <body>
        <style>
            body {
                margin: 0;
            }

            #scriptreq {
                display: none;
            }
        </style>
        <p id="scriptreq">pages/missilelauncher.js</p>
        <script type="module">
            import * as three from 'three';
            import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
            import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';

            three.Cache.enabled = true;
            // lowk clueless about three.js so i'm just following their tutorial

            const scene = new three.Scene();
            const camera = new three.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const renderer = new three.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // load material
            const matLoader = new MTLLoader();
            const remoteMaterial = await matLoader.loadAsync('assets/bigredbutton.mtl');
            // load button mesh
            const objLoader = new OBJLoader();
            objLoader.setMaterials(remoteMaterial);
            const remote = await objLoader.loadAsync('assets/bigredbutton.obj');
            scene.add(remote);

            const spotlight = new three.DirectionalLight(0xffffff, 14);
            spotlight.position.set(10,10,10);
            spotlight.target.position.set(0,0,0);
            scene.add(spotlight)

            camera.position.z = 5;
            remote.rotation.set(1,-1,0);

            // For detecting if pushed or not
            var isMouseDown = false;
            renderer.domElement.addEventListener("mousedown", () => {
                isMouseDown = true;
            });

            renderer.domElement.addEventListener("mouseup", () => {
                isMouseDown = false;
            });

            renderer.domElement.addEventListener("mouseleave", () => {
                isMouseDown = false;
            });

            renderer.setAnimationLoop((time) => {
                // match viewport to window size
                camera.aspect = (window.innerWidth / window.innerHeight);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.render(scene, camera);
                remote.children[1].position.lerp(new three.Vector3(0, isMouseDown ? -0.5 : 0 ,0), 0.3)
            });

            // Launch missile signal
            var launch = new Event("launch");
        </script>
    </body>
</html>
