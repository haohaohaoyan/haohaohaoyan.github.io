<!DOCTYPE html>
<html>
    <head>
        <title>Spin</title>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
				}
			}
		</script>
    </head>
    <body>
        <style>
            body {
                margin: 0;
            }
        </style>
        <script type="module">
            import * as three from 'three';
            import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
            import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';

            three.Cache.enabled = true;
            var display = document.querySelector("#spinner");
            // lowk clueless about three.js so i'm just following their tutorial

            const scene = new three.Scene();
            const camera = new three.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const renderer = new three.WebGLRenderer();
            renderer.setClearColor(0xffffff, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // load material
            const matLoader = new MTLLoader();
            const mikuMaterial = await matLoader.loadAsync('assets/spinny/miku.mtl');
            // load spinny miku
            const objLoader = new OBJLoader();
            objLoader.setMaterials(mikuMaterial);
            const miku = await objLoader.loadAsync('assets/spinny/miku.obj');
            scene.add(miku);
            miku.rotation.x = 3.14/2;

            camera.position.z = 6;

            // ambient light should be fine, for some reason the model already has baked shadows?
            // handheld programmers were legendary
            scene.add(new three.AmbientLight(0xffffff, 1));

            renderer.setAnimationLoop((time) => {
                camera.aspect = (window.innerWidth / window.innerHeight);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                miku.rotation.z = time / 200;
                renderer.render(scene, camera);
            });
        </script>
    </body>
</html>
