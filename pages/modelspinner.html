<!DOCTYPE html>
<html>
    <head>
        <title>Spin</title>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
				}
			}
		</script>
    </head>
    <body>
        <style>
            body {
                margin: 0;
            }
        </style>
        <script type="module">
            import * as three from 'three';

            var display = document.querySelector("#spinner");
            // lowk clueless about three.js so i'm just following their tutorial

            const scene = new three.Scene();
            const camera = new three.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const renderer = new three.WebGLRenderer();
            renderer.setClearColor(0xffffff, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // demo cube
            const cube_geo = new three.BoxGeometry(1,3,1);
            const material = new three.MeshNormalMaterial();
            const cube = new three.Mesh(cube_geo, material);
            scene.add(cube);

            camera.position.z = 5;

            renderer.setAnimationLoop((time) => {
                camera.aspect = (window.innerWidth / window.innerHeight);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                cube.rotation.y = time / 500;
                cube.rotation.x = time / 500;
                renderer.render(scene, camera);
            });
        </script>
    </body>
</html>
