<!DOCTYPE html>
<html>
	<head>
		<title>haoyan li</title>
		<link rel="icon" type="image/png" href="favicon.png">
		<link rel="stylesheet" href="main.css">
	</head>
	<body>
		<!-- You aren't going to find anything except mounds of spaghetti JS in here -->
		<!-- global styles -->
		<style>
			.accented {
				background-color: cornflowerblue;
				color: white;
				font-family: Arial, Helvetica, sans-serif;
			}
		</style>
		<template id="window-template">
			<div class="window" style="top: 0; left: 0; width: 400px; height: 300px;">
				<div class="headerbar accented">
					<p class="accented">Header</p>
					<div style="margin-left: auto;">
						<!--<button class="minimize" title="Minimize window">
							-
						</button> -->
						<button class="toggle-window" title="Toggle fullscreen">
							□
						</button>
						<button class="close" title="Close window">
							x
						</button>
					</div>
				</div>
				<div class="stretch-vertical"></div>
				<div class="stretch-horizontal"></div>
				<div class="stretch-diagonal"></div>
			</div>
		</template>
		<template id="taskbar-item-template">
			<div class="taskbar-item">
				<p>item</p>
			</div>
		</template>

		<div id="taskbar" class="accented">
			<button style="background-color: transparent; border-style: none;" id="open-start-page-button">
				<img src="logo.svg" width="200px;" title="Open start page">
			</button>
			<p id="clock" style="font-family: 'Courier New'; position: absolute; right: 20px;" class="accented"></p>
		</div>
		<div id="rightclickmenu" style="top: 0; left: 0;">
			<button id="rightclickmenu-openfile">Open file</button>
		</div>
		<div id="appcontainer">
			<button class="appicon" onclick="createWindow('pages/start.html')">
				<img src="icons/fileicon.png">
				<h3>start page</h3>
			</button>
			<button class="appicon" onclick="createWindow('pages/projects.html')">
				<img src="icons/fileicon.png">
				<h3>projects</h3>
			</button>
			<button class="appicon" onclick="location.href = 'pages/start.html'">
				<img src="icons/gearicon.png">
				<h3>open in page mode</h3>
			</button>
			<button class="appicon" onclick="window.open('https://www.youtube.com/playlist?list=PLtsxDYadEuK4Up_8Pg_6XmBBsp9Bqui8h', '_blank').focus();">
				<img src="icons/playlist.png">
				<h3>my study playlist</h3>
			</button>
			<button class="appicon" onclick="createWindow('pages/draw.html')">
				<img src="icons/draw.png">
				<h3>draw</h3>
			</button>
			<!-- <button class="appicon" onclick="createWindow('pages/gamelist.html')">
				<img src="fileicon.png">
				<h3>games i play</h3>
			</button> -->
		</div>
		<script src="os.js"></script>
	</body>
</html>
